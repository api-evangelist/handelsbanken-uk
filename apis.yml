name: Handelsbanken UK
kind: company
description: >-
  Handelsbanken UK (Handelsbanken plc) is the UK relationship bank of Svenska
  Handelsbanken AB (publ), the Swedish banking group, and operates a
  decentralised network of over 200 local branches serving personal and business
  customers across Britain. Incorporated as a wholly-owned UK subsidiary and
  authorised by the Prudential Regulation Authority and regulated by the FCA and
  PRA (Financial Services Register number 806852, authorised since 2018), it is
  a full-service home-market bank rather than one of the CMA9-mandated
  institutions. Handelsbanken meets its UK Open Banking / PSD2 obligations
  through the group developer portal at developer.handelsbanken.com, where its
  Great Britain market APIs - Account Information (AIS), Card Account
  Information, Payment Initiation (PIS), and Confirmation of Funds - are
  published to the Berlin Group NextGenPSD2 standard rather than the OBIE
  Read/Write standard used by the CMA9. Third-party providers enrol against the
  production gateway at api.handelsbanken.com using a PSD2 eIDAS (QWAC/QSEALC)
  or UK Open Banking (OBWAC) certificate, with OAuth2 client authentication,
  mutual-TLS, and PSD2 strong customer authentication, and can test against a
  sandbox before going live.
