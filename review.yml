actions:
  apisYmlUpdated: true
  openapiHarvested: []
  reason: |
    Handelsbanken UK exposes a real, documented, sandbox-backed PSD2 API surface
    via the group developer portal, built to Berlin Group NextGenPSD2 (not OBIE
    Read/Write, not CMA9). Seven real API products were captured (four GB PSD2
    APIs, a Third-Parties enrolment API, and two first-party premium APIs) with
    verified developer-portal URLs and the real production gateway base URL. No
    public OpenAPI could be harvested (specs are behind an authenticated login)
    and no OBIE spec was substituted, to avoid misrepresenting conformance. No
    public Open Data endpoint exists for this bank; none was fabricated. Pricing
    is left to the enrichment pipeline (regulated PSD2 access is free; premium
    APIs are commercial).
